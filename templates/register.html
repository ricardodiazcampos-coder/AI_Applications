{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Crear cuenta</h4>
        <p class="small text-muted">La contraseña debe tener al menos 5 caracteres e incluir un carácter especial (ej.: <code>MiClave!</code>).</p>
        <form method="post" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label class="form-label">Nombre de usuario</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" name="password_confirm" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        </form>
        <p class="small text-muted mt-3 mb-0">
          ¿Ya tiene cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
