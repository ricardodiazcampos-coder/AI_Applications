# Configuración de despliegue atómico en Netlify
# https://docs.netlify.com/deploy/deploy-overview/

[build]
  command = "echo Deploy estatico listo"
  publish = "static"
  functions = "netlify/functions"

[functions]
  included_files = [
    "templates/**",
    "app.py",
    "auth_service.py",
    "auth_validators.py",
    "models.py",
    "persistence.py",
    "serialization.py",
    "utils.py",
    "validators.py",
    "web_logic.py"
  ]

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
